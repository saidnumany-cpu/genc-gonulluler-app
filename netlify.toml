[build]
  command = "npx expo export -p web"
  publish = "dist"

# Tek sayfa uygulama: tüm yollar index.html'e gider (yenilemede 404 olmasın).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
